<svg width="400" height="100" viewBox="0 0 400 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="activeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9933;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CC0033;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Home Icon (Active) -->
  <g transform="translate(50, 20)">
    <rect x="0" y="0" width="60" height="60" rx="8" fill="#FFF5E1"/>
    <text x="30" y="40" text-anchor="middle" fill="#FF9933" font-family="Arial" font-size="24">🏠</text>
    <text x="30" y="75" text-anchor="middle" fill="#FF9933" font-family="Poppins" font-size="10" font-weight="500">Home</text>
  </g>
  
  <!-- Collaborate Icon -->
  <g transform="translate(120, 20)">
    <rect x="0" y="0" width="60" height="60" rx="8" fill="#F5F5F5"/>
    <text x="30" y="40" text-anchor="middle" fill="#999999" font-family="Arial" font-size="24">🤝</text>
    <text x="30" y="75" text-anchor="middle" fill="#999999" font-family="Poppins" font-size="10" font-weight="500">Collaborate</text>
  </g>
  
  <!-- Promote Icon -->
  <g transform="translate(190, 20)">
    <rect x="0" y="0" width="60" height="60" rx="8" fill="#F5F5F5"/>
    <text x="30" y="40" text-anchor="middle" fill="#999999" font-family="Arial" font-size="24">📱</text>
    <text x="30" y="75" text-anchor="middle" fill="#999999" font-family="Poppins" font-size="10" font-weight="500">Promote</text>
  </g>
  
  <!-- Shows Icon -->
  <g transform="translate(260, 20)">
    <rect x="0" y="0" width="60" height="60" rx="8" fill="#F5F5F5"/>
    <text x="30" y="40" text-anchor="middle" fill="#999999" font-family="Arial" font-size="24">🎪</text>
    <text x="30" y="75" text-anchor="middle" fill="#999999" font-family="Poppins" font-size="10" font-weight="500">Shows</text>
  </g>
  
  <!-- Events Icon -->
  <g transform="translate(330, 20)">
    <rect x="0" y="0" width="60" height="60" rx="8" fill="#F5F5F5"/>
    <text x="30" y="40" text-anchor="middle" fill="#999999" font-family="Arial" font-size="24">🎉</text>
    <text x="30" y="75" text-anchor="middle" fill="#999999" font-family="Poppins" font-size="10" font-weight="500">Events</text>
  </g>
</svg>
