<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9933;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CC0033;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#339933;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF9933;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer ring -->
  <circle cx="60" cy="60" r="58" fill="none" stroke="url(#ringGradient)" stroke-width="4" opacity="0.3"/>
  
  <!-- Main circle -->
  <circle cx="60" cy="60" r="50" fill="url(#logoGradient)"/>
  
  <!-- Inner decorative ring -->
  <circle cx="60" cy="60" r="40" fill="none" stroke="#FFF5E1" stroke-width="2" opacity="0.8"/>
  
  <!-- Punjabi Music Note -->
  <g transform="translate(60, 60)">
    <!-- Note head -->
    <ellipse cx="0" cy="0" rx="8" ry="6" fill="#FFF5E1"/>
    
    <!-- Note stem -->
    <rect x="-2" y="-6" width="4" height="20" fill="#FFF5E1"/>
    
    <!-- Note flag -->
    <path d="M 2 -6 Q 12 -10 12 -20 Q 12 -15 8 -12 Q 4 -8 2 -6" fill="#FFF5E1"/>
  </g>
  
  <!-- Traditional Punjabi pattern elements -->
  <g transform="translate(60, 60)" opacity="0.6">
    <!-- Decorative dots -->
    <circle cx="-15" cy="-15" r="2" fill="#FFF5E1"/>
    <circle cx="15" cy="-15" r="2" fill="#FFF5E1"/>
    <circle cx="-15" cy="15" r="2" fill="#FFF5E1"/>
    <circle cx="15" cy="15" r="2" fill="#FFF5E1"/>
    
    <!-- Traditional motifs -->
    <path d="M -20 0 Q -15 -5 -10 0 Q -15 5 -20 0" fill="#FFF5E1" opacity="0.7"/>
    <path d="M 20 0 Q 15 -5 10 0 Q 15 5 20 0" fill="#FFF5E1" opacity="0.7"/>
    <path d="M 0 -20 Q -5 -15 0 -10 Q 5 -15 0 -20" fill="#FFF5E1" opacity="0.7"/>
    <path d="M 0 20 Q -5 15 0 10 Q 5 15 0 20" fill="#FFF5E1" opacity="0.7"/>
  </g>
</svg>
