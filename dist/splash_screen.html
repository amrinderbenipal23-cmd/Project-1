<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punjabi Music Collaboration - Splash Screen</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&family=Noto+Sans+Punjabi:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 390px;
            height: 844px;
            margin: 0 auto;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #FF9933 0%, #339933 50%, #3366CC 100%);
            position: relative;
            overflow: hidden;
        }

        .splash-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 40px 20px;
        }

        .background-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.1;
            background-image: 
                radial-gradient(circle at 20% 80%, #FFF5E1 2px, transparent 2px),
                radial-gradient(circle at 80% 20%, #FFF5E1 2px, transparent 2px);
            background-size: 50px 50px;
        }

        .logo-container {
            position: relative;
            margin-bottom: 40px;
        }

        .logo-circle {
            width: 120px;
            height: 120px;
            background: linear-gradient(45deg, #FFF5E1, #FF9933);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            position: relative;
        }

        .logo-circle::before {
            content: '';
            position: absolute;
            width: 100px;
            height: 100px;
            border: 3px solid #339933;
            border-radius: 50%;
            border-top-color: transparent;
            border-right-color: transparent;
            animation: rotate 3s linear infinite;
        }

        .logo-circle::after {
            content: '';
            position: absolute;
            width: 80px;
            height: 80px;
            border: 2px solid #CC0033;
            border-radius: 50%;
            border-bottom-color: transparent;
            border-left-color: transparent;
            animation: rotate 2s linear infinite reverse;
        }

        .logo-text {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 24px;
            color: #333333;
            z-index: 2;
            position: relative;
        }

        .app-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 28px;
            color: #FFF5E1;
            text-align: center;
            margin-bottom: 8px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .app-subtitle {
            font-family: 'Poppins', sans-serif;
            font-weight: 400;
            font-size: 16px;
            color: #FFF5E1;
            text-align: center;
            margin-bottom: 60px;
            opacity: 0.9;
        }

        .get-started-btn {
            background: linear-gradient(45deg, #FF9933, #CC0033);
            color: white;
            border: none;
            padding: 16px 48px;
            border-radius: 12px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(255, 153, 51, 0.4);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .get-started-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .get-started-btn:hover::before {
            left: 100%;
        }

        .get-started-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(255, 153, 51, 0.6);
        }

        .decorative-elements {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .music-note {
            position: absolute;
            color: #FFF5E1;
            font-size: 24px;
            opacity: 0.3;
            animation: float 4s ease-in-out infinite;
        }

        .music-note:nth-child(1) {
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .music-note:nth-child(2) {
            top: 30%;
            right: 15%;
            animation-delay: 1s;
        }

        .music-note:nth-child(3) {
            bottom: 30%;
            left: 20%;
            animation-delay: 2s;
        }

        .music-note:nth-child(4) {
            bottom: 20%;
            right: 10%;
            animation-delay: 3s;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .loading-dots {
            display: flex;
            gap: 8px;
            margin-top: 30px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #FFF5E1;
            border-radius: 50%;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <div class="background-pattern"></div>
        
        <div class="decorative-elements">
            <div class="music-note">♪</div>
            <div class="music-note">♫</div>
            <div class="music-note">♪</div>
            <div class="music-note">♫</div>
        </div>

        <div class="logo-container">
            <div class="logo-circle">
                <div class="logo-text">PM</div>
            </div>
        </div>

        <h1 class="app-title">Punjabi Music</h1>
        <h2 class="app-title">Collaboration</h2>
        <p class="app-subtitle">Connect • Create • Collaborate</p>

        <button class="get-started-btn">Get Started</button>

        <div class="loading-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>
</body>
</html>
