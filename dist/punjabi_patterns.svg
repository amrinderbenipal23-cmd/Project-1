<svg width="500" height="300" viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="patternGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9933;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#339933;stop-opacity:0.3" />
    </linearGradient>
    <linearGradient id="patternGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#CC0033;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#3366CC;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  
  <!-- Traditional Punjabi Phulkari Pattern -->
  <g transform="translate(50, 50)">
    <rect x="0" y="0" width="100" height="100" fill="url(#patternGradient1)" opacity="0.1"/>
    <!-- Floral motifs -->
    <g transform="translate(50, 50)">
      <circle cx="0" cy="0" r="15" fill="none" stroke="#FF9933" stroke-width="2" opacity="0.6"/>
      <circle cx="0" cy="0" r="8" fill="none" stroke="#339933" stroke-width="1" opacity="0.6"/>
      <path d="M -15 0 Q -10 -5 -5 0 Q -10 5 -15 0" fill="#FF9933" opacity="0.4"/>
      <path d="M 15 0 Q 10 -5 5 0 Q 10 5 15 0" fill="#FF9933" opacity="0.4"/>
      <path d="M 0 -15 Q -5 -10 0 -5 Q 5 -10 0 -15" fill="#339933" opacity="0.4"/>
      <path d="M 0 15 Q -5 10 0 5 Q 5 10 0 15" fill="#339933" opacity="0.4"/>
    </g>
  </g>
  
  <!-- Geometric Pattern -->
  <g transform="translate(200, 50)">
    <rect x="0" y="0" width="100" height="100" fill="url(#patternGradient2)" opacity="0.1"/>
    <!-- Diamond pattern -->
    <g transform="translate(50, 50)">
      <polygon points="0,-20 20,0 0,20 -20,0" fill="none" stroke="#CC0033" stroke-width="2" opacity="0.6"/>
      <polygon points="0,-10 10,0 0,10 -10,0" fill="#3366CC" opacity="0.4"/>
      <circle cx="0" cy="0" r="3" fill="#FF9933"/>
    </g>
  </g>
  
  <!-- Musical Note Pattern -->
  <g transform="translate(350, 50)">
    <rect x="0" y="0" width="100" height="100" fill="url(#patternGradient1)" opacity="0.1"/>
    <!-- Scattered musical notes -->
    <g transform="translate(20, 20)">
      <text x="0" y="0" fill="#FF9933" font-size="16" opacity="0.6">♪</text>
    </g>
    <g transform="translate(60, 30)">
      <text x="0" y="0" fill="#339933" font-size="20" opacity="0.6">♫</text>
    </g>
    <g transform="translate(40, 60)">
      <text x="0" y="0" fill="#CC0033" font-size="14" opacity="0.6">♪</text>
    </g>
    <g transform="translate(80, 70)">
      <text x="0" y="0" fill="#3366CC" font-size="18" opacity="0.6">♫</text>
    </g>
  </g>
  
  <!-- Border Pattern -->
  <g transform="translate(50, 200)">
    <rect x="0" y="0" width="400" height="60" fill="none" stroke="url(#patternGradient1)" stroke-width="2" opacity="0.3"/>
    <!-- Repeating border motif -->
    <g transform="translate(20, 30)">
      <path d="M 0 0 L 10 -5 L 20 0 L 10 5 Z" fill="#FF9933" opacity="0.4"/>
    </g>
    <g transform="translate(60, 30)">
      <path d="M 0 0 L 10 -5 L 20 0 L 10 5 Z" fill="#339933" opacity="0.4"/>
    </g>
    <g transform="translate(100, 30)">
      <path d="M 0 0 L 10 -5 L 20 0 L 10 5 Z" fill="#CC0033" opacity="0.4"/>
    </g>
    <g transform="translate(140, 30)">
      <path d="M 0 0 L 10 -5 L 20 0 L 10 5 Z" fill="#3366CC" opacity="0.4"/>
    </g>
    <g transform="translate(180, 30)">
      <path d="M 0 0 L 10 -5 L 20 0 L 10 5 Z" fill="#FF9933" opacity="0.4"/>
    </g>
    <g transform="translate(220, 30)">
      <path d="M 0 0 L 10 -5 L 20 0 L 10 5 Z" fill="#339933" opacity="0.4"/>
    </g>
    <g transform="translate(260, 30)">
      <path d="M 0 0 L 10 -5 L 20 0 L 10 5 Z" fill="#CC0033" opacity="0.4"/>
    </g>
    <g transform="translate(300, 30)">
      <path d="M 0 0 L 10 -5 L 20 0 L 10 5 Z" fill="#3366CC" opacity="0.4"/>
    </g>
    <g transform="translate(340, 30)">
      <path d="M 0 0 L 10 -5 L 20 0 L 10 5 Z" fill="#FF9933" opacity="0.4"/>
    </g>
    <g transform="translate(380, 30)">
      <path d="M 0 0 L 10 -5 L 20 0 L 10 5 Z" fill="#339933" opacity="0.4"/>
    </g>
  </g>
</svg>
