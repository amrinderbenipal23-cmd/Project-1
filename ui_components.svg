<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="buttonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9933;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CC0033;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF5E1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Primary Button -->
  <g transform="translate(50, 50)">
    <rect x="0" y="0" width="120" height="40" rx="8" fill="url(#buttonGradient)" filter="url(#shadow)"/>
    <text x="60" y="25" text-anchor="middle" fill="white" font-family="Montserrat" font-size="14" font-weight="600">Get Started</text>
  </g>
  
  <!-- Secondary Button -->
  <g transform="translate(200, 50)">
    <rect x="0" y="0" width="120" height="40" rx="8" fill="none" stroke="#FF9933" stroke-width="2"/>
    <text x="60" y="25" text-anchor="middle" fill="#FF9933" font-family="Montserrat" font-size="14" font-weight="600">Learn More</text>
  </g>
  
  <!-- Card Component -->
  <g transform="translate(50, 120)">
    <rect x="0" y="0" width="200" height="120" rx="12" fill="url(#cardGradient)" filter="url(#shadow)"/>
    <rect x="0" y="0" width="200" height="4" rx="12" fill="url(#buttonGradient)"/>
    <circle cx="30" cy="40" r="20" fill="url(#buttonGradient)"/>
    <text x="30" y="45" text-anchor="middle" fill="white" font-family="Arial" font-size="12" font-weight="bold">AS</text>
    <text x="70" y="30" fill="#333333" font-family="Montserrat" font-size="16" font-weight="600">Amar Singh</text>
    <text x="70" y="45" fill="#FF9933" font-family="Poppins" font-size="12" font-weight="500">Music Producer</text>
    <text x="70" y="60" fill="#666666" font-family="Poppins" font-size="10">📍 Delhi, India</text>
    <rect x="70" y="75" width="60" height="20" rx="10" fill="#FFF5E1"/>
    <text x="100" y="87" text-anchor="middle" fill="#FF9933" font-family="Poppins" font-size="10" font-weight="500">Punjabi</text>
  </g>
  
  <!-- Input Field -->
  <g transform="translate(300, 120)">
    <rect x="0" y="0" width="200" height="40" rx="8" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="2"/>
    <text x="15" y="25" fill="#999999" font-family="Poppins" font-size="14">Enter your email</text>
  </g>
  
  <!-- Search Bar -->
  <g transform="translate(50, 280)">
    <rect x="0" y="0" width="250" height="40" rx="8" fill="#F5F5F5"/>
    <text x="15" y="25" fill="#999999" font-family="Poppins" font-size="14">🔍 Search artists, genres...</text>
  </g>
  
  <!-- Filter Tab -->
  <g transform="translate(350, 280)">
    <rect x="0" y="0" width="80" height="30" rx="15" fill="#FF9933"/>
    <text x="40" y="20" text-anchor="middle" fill="white" font-family="Poppins" font-size="12" font-weight="500">All</text>
  </g>
  
  <!-- Notification Badge -->
  <g transform="translate(500, 50)">
    <circle cx="20" cy="20" r="15" fill="#CC0033"/>
    <text x="20" y="25" text-anchor="middle" fill="white" font-family="Poppins" font-size="12" font-weight="600">3</text>
  </g>
  
  <!-- Progress Bar -->
  <g transform="translate(50, 350)">
    <rect x="0" y="0" width="200" height="4" rx="2" fill="#E0E0E0"/>
    <rect x="0" y="0" width="120" height="4" rx="2" fill="url(#buttonGradient)"/>
  </g>
  
  <!-- Credit Balance -->
  <g transform="translate(300, 350)">
    <rect x="0" y="0" width="150" height="40" rx="8" fill="url(#buttonGradient)"/>
    <text x="75" y="20" text-anchor="middle" fill="white" font-family="Montserrat" font-size="16" font-weight="700">500 Credits</text>
    <text x="75" y="35" text-anchor="middle" fill="white" font-family="Poppins" font-size="10" opacity="0.9">Available</text>
  </g>
</svg>
